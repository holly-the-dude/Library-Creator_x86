---
# Debian amd64/arm64 startup: existing storage, host networking, content containers.
- name: Start Library
  hosts: localhost
  gather_facts: false
  vars:
    # Hostname/target label for the appliance.
    target_ip: library
    library_storage_mode: directory
    library_install_root: /opt/library-creator

    # Leave the port empty to discover an unambiguous USB GPS automatically.
    # Override with -e gps_port=/dev/serial/by-id/... -e gps_baud=4800 if needed.
    # A by-id path survives tty renumbering; baud must match the receiver's NMEA.
    gps_port: ""
    gps_baud: 9600
    # StreetZim owns the receiver; library_maps relays its GPS API. Disable to
    # use the previous maps-owned serial reader, or omit the StreetZim image.
    street_zim_enabled: true
    # Empty matches the documents folder owner, including root-owned exFAT.
    craft_puid: ''
    craft_pgid: ''

    # Empty selects the single USB device that answers the Meshtastic protocol.
    # A USB bridge VID or an esptool chip match alone does not identify Meshtastic.
    # Override if multiple radios are attached: -e meshtastic_device=/dev/serial/by-id/...
    meshtastic_device: ""
    meshtastic_probe_timeout: 12

  pre_tasks:
    - name: Load host installation settings
      ansible.builtin.include_vars: /etc/library/config.json
      tags: [always]

  tasks:
    - name: test connect
      ansible.builtin.raw: |
        whoami
        hostname
        # df -h
      register: whowhatwhere
      tags: runthis

    - name: show results
      ansible.builtin.debug:
        msg:
          - "{{ whowhatwhere }}"
      tags: runthis
    - name: Require mounted content storage when selected
      ansible.builtin.command: mountpoint -q /Library
      changed_when: false
      when: library_storage_mode == 'mounted'

    - name: Create content directories
      ansible.builtin.file:
        path: "/Library/{{ item }}"
        state: directory
        mode: '0755'
      loop: [library, web, wiki, music, calibre, maps, documents]

    - name: Ensure the Podman bridge exists
      ansible.builtin.command: podman network inspect podman
      register: library_bridge
      changed_when: false
      failed_when: library_bridge.rc not in [0, 125]

    - name: Create the Podman bridge when absent
      ansible.builtin.command: podman network create --subnet 10.88.0.0/16 --gateway 10.88.0.1 podman
      when: library_bridge.rc != 0

    - name: Verify fixed service addresses fit the bridge
      ansible.builtin.command: podman network inspect podman
      register: library_bridge_verified
      changed_when: false
      failed_when: >-
        (library_bridge_verified.stdout | from_json)[0].subnets[0].subnet != '10.88.0.0/16'

    ###############################
    # WIKI (Kiwix) — started only if .zim content is present.
    # First (re)builds wiki.xml if there are more .zim files than entries in
    # the existing library, then serves it via kiwix-serve on :6902.
    ###############################
    - name: see if wiki is there if not dont start
      ansible.builtin.shell: |
        test -f /Library/wiki/wiki.xml && echo exist || echo absent
        ZIMS=`ls /Library/wiki/*.zim |wc -l`
        ZIMXML=`cat /Library/wiki/wiki.xml |grep -c -oP 'path="\K[^"]*'`
        if [ "$ZIMS" -gt "$ZIMXML" ]; then
          echo absent
        fi
      register: wiki_exist

    - name: debug show wiki_exist
      ansible.builtin.debug:
        var: wiki_exist.stdout

    # If the wiki library is missing/out of date, (re)generate wiki.xml from
    # every .zim file found.
    - name: see if zim file is there
      when: '"absent" in wiki_exist.stdout'
      block:
        - name: look for zim files
          ansible.builtin.shell: |
            ls /Library/wiki/*.zim |grep zim -c && echo "zims" || echo "nothing"
          register: zims

        - name: create wiki.xml
          when: '"zim" in zims.stdout'
          ansible.builtin.shell: |
            CWIKI=`ls /Library/wiki/*.zim |sed -z 's/\n/ /g' |awk '{print "kiwix-manage /Library/wiki/wiki.xml add "$0}'`
            podman run --privileged -v /Library/wiki:/Library/wiki localhost/wiki /bin/sh -c "$CWIKI"
          register: cwiki

        - name: debug show cwiki
          ansible.builtin.debug:
            var: cwiki

    # Re-check for wiki.xml after the potential rebuild above.
    - name: see if wiki is there if not dont start
      ansible.builtin.shell: |
        test -f /Library/wiki/wiki.xml && echo exist || echo absent
      register: wiki_exist

    # Start Kiwix only when its library exists.
    - name: start wiki block
      when: '"absent" not in wiki_exist.stdout'
      block:
      - name: see if wiki container is running
        ansible.builtin.shell: |
          podman ps |grep wiki >/dev/null && echo Running || echo Stopped
        register: wiki
        become: true

      - name: debug show wiki state
        ansible.builtin.debug:
          var: wiki

      # Serve the Kiwix library on 10.88.0.200:6902 if not already running.
      - name: start wiki container
        ansible.builtin.shell: |
          podman run -d --name wiki --ip 10.88.0.200 --privileged \
          --restart=always --replace \
          -v /Library/wiki:/wiki -p 6902:6902 \
          localhost/wiki /bin/sh -c \
          "kiwix-serve -v -p 6902 --nodatealiases --library /wiki/wiki.xml"


        register: startwiki
        become: true

      - name: show startup of wiki
        when: '"Stopped" in wiki.stdout'
        ansible.builtin.debug:
          var: startwiki.stdout_lines

      # Health check: poll the wiki landing page until it serves content.
      - name: verify wiki started
        ansible.builtin.shell: |
          curl -s localhost:6902 |grep -E 'Welcome|Wikipedia'  && echo "started"  || echo "failed"
        register: wikiverify
        ignore_errors: true
        until: '"started" in wikiverify.stdout'
        retries: 4
        delay: 30

      - name: set fact for wikiverify true
        when: '"started" in wikiverify.stdout'
        ansible.builtin.set_fact:
          wikiexist: true
      - name: set fact for wikiexist false
        when: '"failed" in wikiverify.stdout'
        ansible.builtin.set_fact:
          wikiexist: false

    - name: check optional StreetZim image
      ansible.builtin.command: podman image exists localhost/street_zim:latest
      register: street_zim_image
      changed_when: false
      failed_when: street_zim_image.rc not in [0, 1]

    - name: initialize StreetZim GPS ownership
      ansible.builtin.set_fact:
        street_zim_active: false

    - name: release GPS from a disabled StreetZim service
      when: not (street_zim_enabled | bool) or street_zim_image.rc != 0
      ansible.builtin.command: podman stop --ignore street_zim

    - name: start StreetZim and its shared GPS feed
      when:
        - street_zim_enabled | bool
        - street_zim_image.rc == 0
      block:
        # Release the old serial reader BEFORE handing the receiver to StreetZim.
        - name: stop the previous Maps GPS reader
          ansible.builtin.command: podman stop --ignore library_maps

        - name: start StreetZim container
          ansible.builtin.command:
            argv:
              - podman
              - run
              - -d
              - --name=street_zim
              - --replace
              - --restart=unless-stopped
              - --privileged
              - --ip=10.88.0.216
              - -p
              - '8093:8093'
              - -v
              - /Library/wiki:/data:ro
              # Bind directory for receivers attached/reconnected after boot.
              # Never relabel the host /dev tree.
              - -v
              - /dev:/dev
              - -e
              - GPS_MODE=serial
              - -e
              - "GPS_PORT={{ gps_port }}"
              - -e
              - "GPS_BAUD={{ gps_baud }}"
              - localhost/street_zim:latest

        - name: wait for StreetZim reader (GPS fix is not required)
          ansible.builtin.uri:
            url: http://127.0.0.1:8093/health
            return_content: true
          register: street_zim_health
          until: (street_zim_health.json | default({})).get('ready', false)
          retries: 30
          delay: 2

        - name: use StreetZim as the shared GPS owner
          ansible.builtin.set_fact:
            street_zim_active: true
      rescue:
        # Do not fall back while a restarting StreetZim still has device access.
        - name: release receiver after StreetZim startup failure
          ansible.builtin.command: podman stop --ignore street_zim
        - name: report Maps GPS fallback
          ansible.builtin.debug:
            msg: "StreetZim failed to start. OpenStreetMap will use its local GPS reader. Check podman logs street_zim."

    # ---------------------------------------------------------------------
    # MAPS — started only if tiles exist under /Library/maps.
    # Serves the offline maps UI on 10.88.0.212:8080.
    #
    # Optional car routing: if a routing extract exists at
    # /Library/maps/osm/region.osm.pbf we also start a GraphHopper container
    # (10.88.0.213:8989). The maps web container reaches it by the hostname
    # "graphhopper" (used in nginx.conf as the /api/route upstream). We always
    # pass --add-host graphhopper:10.88.0.213 to the web container so nginx can
    # resolve that upstream name at startup even when routing is disabled — in
    # that case /api/route simply returns 502 until GraphHopper is present.
    ###############################
    - name: see if maps is there if not dont start
      ansible.builtin.shell: |
        C=`ls /Library/maps/* |wc -l`
        if [ "$C" -gt "0" ]; then
          echo present
        fi
        if [ "$C" -eq "0" ]; then
          echo absent
        fi
      register: maps_exist

    - name: debug show maps_exist
      ansible.builtin.debug:
        var: maps_exist.stdout

    # A web selection is only a request. Activate it before GraphHopper starts,
    # with the previous extract kept until the replacement passes verification.
    - name: check for a requested routing region
      ansible.builtin.stat:
        path: /Library/maps/osm/routing-pending.json
        follow: false
      register: routing_pending

    - name: activate downloaded routing region
      when: routing_pending.stat.exists
      tags: [routing_activation]
      become: true
      block:
        - name: require a regular routing request file
          ansible.builtin.assert:
            that: routing_pending.stat.isreg | default(false)
        - name: require images for routing activation
          ansible.builtin.command:
            argv: [podman, image, exists, "{{ item }}"]
          loop:
            - localhost/data_download:latest
            - localhost/library_maps-graphhopper:11
          changed_when: false
        - name: stop routing before changing its input
          ansible.builtin.command:
            argv: [podman, stop, --ignore, graphhopper]
        - name: activate verified routing input offline
          ansible.builtin.command:
            argv:
              - podman
              - run
              - --rm
              - --network=none
              - --entrypoint=python3
              - --mount
              - type=bind,src=/Library,dst=/Library
              - localhost/data_download:latest
              - /opt/data_download/routing.py
      rescue:
        - name: keep previous routing data after activation failure
          ansible.builtin.debug:
            msg: >-
              Routing selection could not be activated. The pending request is
              kept for retry; check the error above and downloader routing status.

    # Detect the optional routing extract. Routing is only started when this
    # file is present, so a maps-only build (no OSM extract) still works.
    - name: see if routing extract exists
      ansible.builtin.shell: |
        test -f /Library/maps/osm/region.osm.pbf && echo present || echo absent
      register: routing_exist

    - name: debug show routing_exist
      ansible.builtin.debug:
        var: routing_exist.stdout

    - name: start maps
      when:
        - '"present" in maps_exist.stdout'
      block:
        # ---- Clear the routing graph cache ONLY when the OSM extract is newer
        #      than the previously-built graph. GraphHopper writes a
        #      "properties" file when an import completes; if region.osm.pbf is
        #      newer than that file (i.e. the user swapped in a new extract),
        #      the stale graph must be removed so GraphHopper re-imports.
        #      Doing this unconditionally would force a slow re-import on every
        #      boot, so we gate it on the timestamp comparison.
        - name: clear routing cache if the OSM extract is newer than the graph
          when: '"present" in routing_exist.stdout'
          ansible.builtin.shell: |
            PBF=/Library/maps/osm/region.osm.pbf
            CACHE=/Library/maps/graph-cache
            STAMP="$CACHE/properties"
            if [ ! -f "$STAMP" ]; then
              # No completed import yet: ensure a clean cache dir and import.
              mkdir -p "$CACHE"
              rm -rf "${CACHE:?}/"* 2>/dev/null || true
              echo "no prior graph - will import"
            elif [ "$PBF" -nt "$STAMP" ]; then
              # New extract is newer than the built graph: purge and re-import.
              echo "stopping graphhopper to clear stale graph"
              podman stop graphhopper 2>/dev/null || true
              podman rm -f graphhopper 2>/dev/null || true
              rm -rf "${CACHE:?}/"* 2>/dev/null || true
              echo "cleared stale graph - will re-import"
            else
              echo "graph is up to date - reuse"
            fi
          register: ghcache
          become: true

        - name: debug show routing cache decision
          when: '"present" in routing_exist.stdout'
          ansible.builtin.debug:
            var: ghcache.stdout_lines

        # ---- Optional GraphHopper routing engine (start before the web UI so
        #      the nginx upstream is reachable as soon as the web container
        #      comes up). Gated on the routing extract being present.
        - name: start graphhopper routing engine
          when: '"present" in routing_exist.stdout'
          ansible.builtin.shell: |
            podman run -d --name graphhopper --ip 10.88.0.213 --replace --privileged \
              --restart unless-stopped \
              -e JAVA_OPTS="-Xms512m -Xmx3g" \
              -v /Library/maps/osm:/data/osm:ro \
              -v /Library/maps/graph-cache:/data/graph-cache \
              localhost/library_maps-graphhopper:11
          register: ghstart

        - name: debug show graphhopper start
          when: '"present" in routing_exist.stdout'
          ansible.builtin.debug:
            var: ghstart

        # GraphHopper imports the PBF and builds its routing graph on first
        # start, which can take minutes for a state-sized extract. Wait until
        # the routing API answers a real request before continuing. A ready
        # engine returns JSON containing "paths"; while importing the port is
        # refused/500, so we retry.
        - name: wait till graphhopper routing is ready
          when: '"present" in routing_exist.stdout'
          ansible.builtin.shell: |
            curl -s "http://10.88.0.213:8989/route?point=39.7392,-104.9903&point=39.5501,-105.7821&profile=car&points_encoded=false" | grep -q '"paths"' && echo ready || echo notready
          register: ghwait
          ignore_errors: true
          until: '"ready" in ghwait.stdout'
          retries: 40
          delay: 15

        - name: start maps
          ansible.builtin.command:
            argv: >-
              {{ ['podman', 'run', '-d', '--name=library_maps', '--ip=10.88.0.212',
                  '--replace', '--restart=unless-stopped', '--add-host=graphhopper:10.88.0.213',
                  '-p', '8080:8080', '-v', '/Library/maps:/storage/maps']
                 + (['-e', 'GPS_UPSTREAM=http://10.88.0.216:8093'] if street_zim_active else
                    ['--privileged', '-v', '/dev:/dev', '-e', 'GPS_PORT=' ~ gps_port,
                     '-e', 'GPS_BAUD=' ~ (gps_baud | string)])
                 + ['localhost/library_maps:latest'] }}
          register: mapsstart

        - name: debug show mapsstart
          ansible.builtin.debug:
            var: mapsstart

        - name: wait till maps started
          ansible.builtin.shell: |
            curl -s localhost:8080 | grep -i 'Library Maps'
          register: mapswait
          ignore_errors: true
          until: '"Library Maps" in mapswait.stdout'
          retries: 8
          delay: 15

        # Confirm end-to-end routing through the web container's /api/route
        # proxy (only when routing was started). Non-fatal: the viewer works
        # regardless of routing.
        - name: verify routing through the maps proxy
          when: '"present" in routing_exist.stdout'
          ansible.builtin.shell: |
            curl -s "http://localhost:8080/api/route?point=39.7392,-104.9903&point=39.5501,-105.7821&profile=car&points_encoded=false" | grep -q '"paths"' && echo routing_ok || echo routing_unavailable
          register: routingverify
          ignore_errors: true

        - name: debug show routing verify
          when: '"present" in routing_exist.stdout'
          ansible.builtin.debug:
            var: routingverify.stdout

    - name: select and start Meshtastic or firmware setup
      tags: [mesh]
      become: true
      block:
        # Verify both images before stopping an existing service. Discovery uses
        # the Meshtastic image's Python API; no host Python packages are needed.
        - name: check local radio service images
          ansible.builtin.command:
            argv: [podman, image, exists, "{{ item }}"]
          loop:
            - localhost/meshtastic:latest
            - localhost/meshflash:latest
          changed_when: false

        - name: release serial ports and port 8086 before discovery
          ansible.builtin.command:
            argv: [podman, stop, --ignore, meshtastic, meshflash]

        - name: find USB devices running Meshtastic
          ansible.builtin.command:
            argv:
              - podman
              - run
              - --rm
              - --network=none
              - -v
              - /dev:/host-dev:ro
              - --device-cgroup-rule=c 188:* rw
              - --device-cgroup-rule=c 166:* rw
              - --entrypoint
              - python3
              - localhost/meshtastic:latest
              - /opt/meshtastic/discover.py
              - --device
              - "{{ meshtastic_device }}"
              - --exclude
              - "{{ gps_port }}"
              - --timeout
              - "{{ meshtastic_probe_timeout | string }}"
          register: meshtastic_probe
          changed_when: false

        - name: read Meshtastic discovery result
          ansible.builtin.set_fact:
            meshtastic_detection: "{{ meshtastic_probe.stdout | from_json }}"
            meshtasticup: false

        - name: require an explicit choice when multiple Meshtastic radios respond
          ansible.builtin.assert:
            that: meshtastic_detection.status != 'ambiguous'
            fail_msg: >-
              Multiple Meshtastic radios responded. Rerun with
              -e meshtastic_device=/dev/serial/by-id/your-radio.
              Detected radios: {{ meshtastic_detection.devices | default([]) }}

        - name: start configured Meshtastic radio
          when: meshtastic_detection.status == 'found'
          block:
            - name: ensure persistent radio data directory
              ansible.builtin.file:
                path: /Library/meshtastic
                state: directory
                mode: '0700'

            - name: start bridge with the detected serial device
              ansible.builtin.command:
                argv:
                  - podman
                  - run
                  - -d
                  - --name=meshtastic
                  - --ip=10.88.0.214
                  - --replace
                  - --restart=unless-stopped
                  - --device
                  - "{{ meshtastic_detection.device }}:/dev/meshtastic:rwm"
                  - -p
                  - 8086:8086
                  - -v
                  - /Library/meshtastic:/var/lib/meshtastic:Z
                  - localhost/meshtastic:latest

            - name: wait for radio handshake and discovery to finish
              ansible.builtin.uri:
                url: http://127.0.0.1:8086/bridge/status
                return_content: true
              register: meshtasticwait
              until: (meshtasticwait.json | default({})).get('ready', false) | bool
              retries: 12
              delay: 10
              ignore_errors: true

            - name: record radio availability
              ansible.builtin.set_fact:
                meshtasticup: "{{ (meshtasticwait.json | default({})).get('ready', false) | bool }}"

        - name: offer firmware setup when no Meshtastic radio responds
          when: meshtastic_detection.status == 'not_found'
          block:
            - name: start meshflash on the Meshtastic web port
              ansible.builtin.command:
                argv:
                  - podman
                  - run
                  - -d
                  - --name=meshflash
                  - --ip=10.88.0.214
                  - --replace
                  - --restart=unless-stopped
                  - -p
                  - 8086:8086
                  - -v
                  - /dev:/host-dev:ro
                  - --device-cgroup-rule=c 188:* rw
                  - --device-cgroup-rule=c 166:* rw
                  - localhost/meshflash:latest

            - name: wait for firmware setup web terminal
              ansible.builtin.uri:
                url: http://127.0.0.1:8086/
                status_code: 200
              register: meshflashwait
              until: meshflashwait.status | default(0) == 200
              retries: 12
              delay: 2

            - name: explain firmware setup handoff
              ansible.builtin.debug:
                msg: >-
                  No Meshtastic radio responded. Open http://library:8086 to
                  install firmware using the radio plugged into this machine. After
                  flashing completes, reboot or run
                  ansible-playbook /root/start_library.yml --tags mesh.

    ###############################
    # MUSIC (LMS) — started only if media exists under /Library/music.
    # Restores a default LMS data set from a tar the first time, then serves
    # on 10.88.0.210:9099 (container port 5082).
    ###############################
    - name: see if music is there if not dont start
      ansible.builtin.shell: |
        C=`ls /Library/music/* |wc -l`
        if [ "$C" -gt "0" ]; then
          echo present
        fi
        if [ "$C" -eq "0" ]; then
          echo absent
        fi
      register: music_exist

    - name: debug show music_exist
      ansible.builtin.debug:
        var: music_exist.stdout

    - name: see if music database  file is there
      when: '"present" in music_exist.stdout'
      block:
        # Check whether the LMS data directory already exists.
        - name: look for database files
          ansible.builtin.shell: |
            ls /Library/.music_data 2>/dev/null && echo exists || echo does_not_exist
          register: musicdb

        - name: create music db
          when: '"does_not_exist" in musicdb.stdout'
          ansible.builtin.shell: |
            cd /
            tar xvf {{ library_install_root }}/setup_library/files/music_default_data.tar
            echo "extracted"
          register: musicdbinstall

        # Start the music container once media + data are confirmed present.
        - name: start music
          when:
            - '"present" in music_exist.stdout'
            - '"exists" in musicdb.stdout or "extracted" in musicdbinstall.stdout'
          block:
            - name: start music
              ansible.builtin.shell: |
                podman run -d --restart unless-stopped --ip 10.88.0.210 --name=music --replace --user 0 --privileged -p 9099:5082 -v /Library/music/:/music/:ro -v /Library/.music_data:/var/lms  music:latest
              register: musicstart

            - name: debug show musicstart
              ansible.builtin.debug:
                var: musicstart

            # Health check: expect a 404 from the root path once LMS is up.
            - name: wait till started
              ansible.builtin.shell: |
                curl -s http://127.0.0.1:9099|grep '404'
              register: musicwait
              ignore_errors: true
              until: '"404" in musicwait.stdout'
              retries: 8
              delay: 15

    - name: check optional music player image
      ansible.builtin.command: podman image exists localhost/music_player:latest
      register: music_player_image
      changed_when: false
      failed_when: music_player_image.rc not in [0, 1]

    - name: start optional iPod-style music player
      when: music_player_image.rc == 0
      block:
        - name: start music player container
          ansible.builtin.command:
            argv:
              - podman
              - run
              - -d
              - --name=music_player
              - --replace
              - --restart=unless-stopped
              - --read-only
              - --network=podman
              - --ip=10.88.0.217
              - -p
              - '2001:8080'
              - -v
              - /Library/music:/music:ro
              - localhost/music_player:latest

        - name: wait for music player
          ansible.builtin.uri:
            url: http://127.0.0.1:2001/
            return_content: true
          register: music_player_health
          until: "'<title>Library Music</title>' in (music_player_health.content | default(''))"
          retries: 15
          delay: 2
      rescue:
        - name: stop failed music player
          ansible.builtin.command: podman stop --ignore music_player
        - name: report optional music player failure
          ansible.builtin.debug:
            msg: "The iPod-style music player did not start. Check podman logs music_player. Library startup will continue."

    - name: manage optional Office add-on
      tags: [craft_apps]
      block:
        - name: check optional Craft office image
          ansible.builtin.command: podman image exists localhost/craft_apps:latest
          register: craft_apps_image
          changed_when: false
          failed_when: craft_apps_image.rc not in [0, 1]

        - name: check whether Craft office is disabled
          ansible.builtin.command: podman image exists localhost/craft_apps:dontrun
          register: craft_apps_disabled
          changed_when: false
          failed_when: craft_apps_disabled.rc not in [0, 1]

        - name: stop disabled or unavailable Craft office desktop
          when: craft_apps_disabled.rc == 0 or craft_apps_image.rc == 1
          ansible.builtin.command: podman stop --ignore craft_apps
          register: craft_apps_stopped
          changed_when: craft_apps_stopped.stdout | length > 0

        - name: start optional Craft office desktop
          when: craft_apps_image.rc == 0 and craft_apps_disabled.rc == 1
          block:
            - name: create missing Craft documents directory
              ansible.builtin.file:
                path: /Library/documents
                state: directory

            - name: discover Craft documents ownership
              ansible.builtin.stat:
                path: /Library/documents
              register: craft_documents

            - name: start Craft office container
              ansible.builtin.command:
                argv:
                  - podman
                  - run
                  - -d
                  - --name=craft_apps
                  - --replace
                  - --restart=unless-stopped
                  - --network=podman
                  - --ip=10.88.0.218
                  - --shm-size=1g
                  - -p
                  - '3001:3001'
                  - -e
                  - 'PUID={{ craft_puid | default(craft_documents.stat.uid, true) }}'
                  - -e
                  - 'PGID={{ craft_pgid | default(craft_documents.stat.gid, true) }}'
                  - -v
                  - /Library/documents:/documents:rw
                  - -v
                  - craft-apps-config:/config:rw
                  - localhost/craft_apps:latest

            - name: wait for Craft office desktop
              ansible.builtin.uri:
                url: https://127.0.0.1:3001/
                validate_certs: false
              register: craft_apps_health
              until: craft_apps_health.status | default(0) == 200
              retries: 30
              delay: 2
          rescue:
            - name: stop failed Craft office desktop
              ansible.builtin.command: podman stop --ignore craft_apps
            - name: report optional Craft office failure
              ansible.builtin.debug:
                msg: 'Library Office did not start. Check podman logs craft_apps and /Library/documents permissions. Library startup will continue.'

    ###############################
    # E-BOOKS (Calibre-Web) — started only if /Library/calibre has content.
    # Restores the calibre database from tar on first run, ingests any new
    # books dropped in put_new_books_here, then serves on 10.88.0.211:8083.
    ###############################
    - name: see if ebook folder is there
      ansible.builtin.shell: |
        C=`ls /Library/calibre |wc -l`
        if [ "$C" -gt "0" ]; then
          echo present
        fi
        if [ "$C" -eq "0" ]; then
          echo absent
        fi
      register: ebook_exist

    # First-run restore of the calibre metadata database if the folder is empty.
    - name: see if ebook  database  file is there if not create it
      when: '"absent" in ebook_exist.stdout'
      block:
        - name: look for database files
          ansible.builtin.shell: |
            ls /Library/calibre/books/metadata.db 2>/dev/null && echo exists || echo does_not_exist
          register: ebookdb

        - name: create ebook  db
          when: '"does_not_exist" in ebookdb.stdout'
          ansible.builtin.shell: |
            cd /
            tar xvf {{ library_install_root }}/setup_library/files/calibre_database.tar
            echo "extracted"
          register: ebookdbinstall

    # Re-check the folder after the potential tar restore above.
    - name: see if ebook folder is there after tar restore
      ansible.builtin.shell: |
        C=`ls /Library/calibre |wc -l`
        if [ "$C" -gt "0" ]; then
          echo present
        fi
        if [ "$C" -eq "0" ]; then
          echo absent
        fi
      register: ebook_exist

    - name: see if ebook  database  file is there if not create it
      when: '"present" in ebook_exist.stdout'
      block:

        - name: start ebook
          when:
            - '"present" in ebook_exist.stdout'
          block:
            # Count any newly-dropped books awaiting import.
            - name: check for new ebooks
              ansible.builtin.shell: |
                ls -l /Library/calibre/put_new_books_here/* |wc -l
              register: newebooks

            - name: add new ebooks
              when: 'newebooks.stdout|int > 0'
              ansible.builtin.shell: |
                podman run --rm --user 0 --network none --privileged \
                  -v /Library/calibre/books:/books:rw \
                  -v /Library/calibre/put_new_books_here:/incoming:rw \
                  localhost/calibre-web /bin/bash -c \
                  "calibredb add --with-library=/books -r --automerge=overwrite /incoming/* && rm -rvf /incoming/*"

            # Start the persistent Calibre-Web server on :8083.
            - name: start ebook
              ansible.builtin.shell: |
                podman run -d --name=ebook --replace --user 0 --restart unless-stopped --stop-timeout 20 --ip 10.88.0.211 --privileged -p 8083:8083  -v /Library/calibre/books:/books:rw  localhost/calibre-web /usr/local/bin/start-calibre-web.sh
              register: ebookstart

            - name: debug show ebookstart
              ansible.builtin.debug:
                var: ebookstart

            # Health check: wait for the Calibre-Web landing page title.
            - name: wait till started
              ansible.builtin.shell: |
                curl -s http://127.0.0.1:8083|grep '<title>Calibre-Web'
              register: ebookwait
              ignore_errors: true
              until: '"<title>Calibre-Web" in ebookwait.stdout'
              retries: 20
              delay: 15

    - name: start data downloader when installed
      tags: [data_download]
      become: true
      block:
        - name: check for data downloader image
          ansible.builtin.command: podman image exists localhost/data_download:latest
          register: data_download_image
          changed_when: false
          failed_when: data_download_image.rc not in [0, 1]

        - name: start installed data downloader
          when: data_download_image.rc == 0
          block:
            - name: confirm selected mounted storage before starting downloader
              when: library_storage_mode == 'mounted'
              ansible.builtin.command: mountpoint -q /Library
              changed_when: false

            - name: check optional host restart socket
              ansible.builtin.stat:
                path: /run/library-control/control.sock
              register: library_control_socket

            - name: check optional host clone socket
              ansible.builtin.stat:
                path: /run/library-clone/clone.sock
              register: library_clone_socket

            - name: run data downloader
              ansible.builtin.command:
                argv: >-
                  {{ ['podman', 'run', '-d', '--name=data_download', '--replace',
                      '--restart=unless-stopped', '--ip=10.88.0.215',
                      '-p', '0.0.0.0:4826:4286',
                      '-e', 'REQUIRE_MOUNT=' + ('1' if library_storage_mode == 'mounted' else '0'),
                      '--mount', 'type=bind,src=/Library,dst=/Library']
                     + (['--mount', 'type=bind,src=/run/library-control,dst=/run/library-control,ro=true']
                        if library_control_socket.stat.issock | default(false) else [])
                     + (['--mount', 'type=bind,src=/run/library-clone,dst=/run/library-clone,ro=true']
                        if library_clone_socket.stat.issock | default(false) else [])
                     + ['localhost/data_download:latest'] }}

            - name: wait for downloader local web interface
              ansible.builtin.uri:
                url: http://127.0.0.1:4826/api/health
                return_content: true
                timeout: 5
              register: data_download_health
              until: (data_download_health.json | default({})).get('status') == 'ok'
              retries: 15
              delay: 2

    ###############################
    # WEBSERVER (main library front-end) — started only if /Library/library
    # exists. Serves on 10.88.0.201:80 and is the primary landing page.
    ###############################
    - name: see if webserver is there if not dont start
      ansible.builtin.shell: |
        test -d /Library/library && echo exist || echo absent
      register: www_exist

    # Start the frontend when its content directory is available.
    - name: start www block
      when: '"exist" in www_exist.stdout'
      block:
      - name: see if www container is running
        ansible.builtin.shell: |
          podman ps |grep webserver >/dev/null && echo Running || echo Stopped
        register: www
        become: true

      - name: debug show www state
        ansible.builtin.debug:
          var: www

      # Launch the web server container (mounts entire /Library read/write,
      # publishes port 80), replacing its previous instance on service restart.
      - name: start www container
        ansible.builtin.shell: |
          podman run -d --name=webserver --replace -v /Library:/library \
          -p 80:80 \
          --ip 10.88.0.201  --privileged  \
          localhost/webserver /bin/sh -c '/usr/bin/python3 /root/library.py;sleep infinity'
        register: startwww
        become: true

      - name: show startup of www
        when: '"Stopped" in www.stdout'
        ansible.builtin.debug:
          var: startwww.stdout_lines
    #################################################
      - name: verify Library web interface
        ansible.builtin.uri:
          url: http://127.0.0.1/
          return_content: true
          timeout: 5
        register: library_web_health
        until: "'Shutdown' in (library_web_health.content | default(''))"
        retries: 60
        delay: 2
