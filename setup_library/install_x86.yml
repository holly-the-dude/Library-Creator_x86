---
- name: Install Library services on Debian amd64 or arm64
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: Require Debian Trixie amd64 or arm64
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_release == 'trixie'
          - ansible_facts.architecture in ['x86_64', 'aarch64']

    - name: Load storage settings
      ansible.builtin.include_vars: /etc/library/config.json

    - name: Persist the selected content mount without remounting it
      when: library_storage_mode == 'mounted'
      block:
        - name: Inspect the mounted filesystem
          ansible.builtin.command:
            argv: [findmnt, --json, --target, /Library, --output, "UUID,FSTYPE,OPTIONS,TARGET"]
          register: library_mount
          changed_when: false

        - name: Read mounted filesystem details
          ansible.builtin.set_fact:
            library_filesystem: "{{ (library_mount.stdout | from_json).filesystems[0] }}"

        - name: Require an identifiable mount at the resolved content path
          ansible.builtin.assert:
            that:
              - library_filesystem.uuid | default('', true) | length > 0
              - library_filesystem.target == library_storage_path

        - name: Record the existing mount by UUID for subsequent boots
          ansible.posix.mount:
            path: "{{ library_storage_path }}"
            src: "UUID={{ library_filesystem.uuid }}"
            fstype: "{{ library_filesystem.fstype }}"
            opts: "{{ (library_filesystem.options.split(',') + ['nofail']) | unique | join(',') }}"
            state: present
            backup: true

    - name: Create startup unit override directory
      ansible.builtin.file:
        path: /etc/systemd/system/start_library.service.d
        state: directory
        mode: '0755'

    - name: Order startup after the resolved content mount
      ansible.builtin.copy:
        dest: /etc/systemd/system/start_library.service.d/storage.conf
        mode: '0644'
        content: |
          [Unit]
          RequiresMountsFor="{{ library_storage_path }}"

    - name: Install boot playbook
      ansible.builtin.copy:
        src: files/start_library.yml
        dest: /root/start_library.yml
        mode: '0644'

    - name: Create Wi-Fi helper directory
      ansible.builtin.file:
        path: /usr/local/lib/library-wifi
        state: directory
        mode: '0755'

    - name: Install Wi-Fi web controls
      ansible.builtin.copy:
        src: files/library_wifi.py
        dest: /usr/local/lib/library-wifi/library_wifi.py
        mode: '0644'

    - name: Install Wi-Fi hotspot configuration helper
      ansible.builtin.copy:
        src: configure_hotspot.sh
        dest: /usr/local/bin/library_configure_hotspot
        mode: '0755'

    - name: Install host control helpers
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
      loop: [library_control.py, library_restart, library_shutdown.py, library_shutdown, library_wifi, library_startup.py]

    - name: Install systemd services
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop:
        - start_library.service
        - shutdown_library.service
        - library-control.socket
        - library-control.service
        - library-restart.service
        - library-wifi.service

    - name: Start Wi-Fi controls
      ansible.builtin.systemd_service:
        name: library-wifi.service
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Enable host control services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [library-control.socket, shutdown_library.service]

    - name: Install USB clone support
      ansible.builtin.import_tasks: clone_tasks.yml
      tags: [clone_service]

    - name: Repair public content permissions before starting Library
      # Only publicly served files: preserve ownership and existing write bits.
      ansible.builtin.import_tasks: public_content_permissions.yml

    - name: Start or refresh Library services
      ansible.builtin.systemd_service:
        name: start_library.service
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Configure root desktop autologin and Firefox startup
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/configure_desktop.py"]
      register: library_desktop
      changed_when: "'configured for the next boot' in library_desktop.stdout"
      tags: [desktop_config]

    - name: Report desktop configuration
      ansible.builtin.debug:
        var: library_desktop.stdout
      tags: [desktop_config]
